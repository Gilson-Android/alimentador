; =====================================================================
;  AquaFeeder ESP32-S3 -- alimentador de aquario com camera
;
;  Escolha o ambiente conforme a sua placa:
;    pio run -e freenove_s3_cam -t upload      (padrao)
;    pio run -e xiao_s3_sense   -t upload
;    pio run -e s3_sem_camera   -t upload
;
;  Monitor serial:  pio device monitor
; =====================================================================
[platformio]
default_envs = freenove_s3_cam

[env]
platform      = espressif32@^6.9.0
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time
lib_deps      = bblanchon/ArduinoJson@^7.2.0
build_flags   = -DCORE_DEBUG_LEVEL=1

; --- Freenove ESP32-S3-WROOM CAM (N8R8) ------------------------------
; Serial sai na UART0 (porta "UART" da placa). Se usar a porta USB
; nativa e nao ver log, acrescente -DARDUINO_USB_CDC_ON_BOOT=1
[env:freenove_s3_cam]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_8MB.csv
board_upload.flash_size         = 8MB
board_upload.maximum_size       = 8388608
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DFEEDER_BOARD=1

; --- Seeed XIAO ESP32S3 Sense ----------------------------------------
[env:xiao_s3_sense]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DFEEDER_BOARD=2

; --- Mesmas placas, mas com NEMA 17 + driver A4988/DRV8825/TMC -------
; Usa os mesmos GPIOs: IN1->STEP, IN2->DIR, IN3->ENABLE
[env:freenove_s3_cam_nema17]
extends = env:freenove_s3_cam
build_flags = ${env:freenove_s3_cam.build_flags} -DMOTOR_DRIVER=2

[env:xiao_s3_sense_nema17]
extends = env:xiao_s3_sense
build_flags = ${env:xiao_s3_sense.build_flags} -DMOTOR_DRIVER=2

; --- Qualquer ESP32-S3 sem camera ------------------------------------
[env:s3_sem_camera]
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -DFEEDER_BOARD=3
